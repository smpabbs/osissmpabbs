<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mockup B · Split picker — Pemilihan Ketua OSIS</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="mockups.css">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
</head>
<body class="b-page mock-page">
  <header class="mock-top">
    <div class="mock-top-left">
      <a class="back" href="index.html">← Semua mockup</a>
      <span class="mock-tag">B · Split picker</span>
      <div class="mock-title">
        <h1>Pilih ketua OSIS</h1>
        <p>Klik nama untuk membaca detail, lalu pilih dari panel kanan.</p>
      </div>
    </div>
    <div class="mock-controls">
      <span class="mock-note">Mockup · suara tidak dikirim</span>
      <div class="role-toggle" role="group" aria-label="Mode demo jumlah pilihan">
        <button type="button" data-limit="1" aria-pressed="true">1 pilihan</button>
        <button type="button" data-limit="2" aria-pressed="false">2 pilihan</button>
      </div>
    </div>
  </header>

  <div class="b-main">
    <div class="b-list" id="bList" role="group" aria-label="Daftar kandidat"></div>

    <section class="b-preview" aria-live="polite">
      <div class="b-photo"><img id="bPhoto" alt=""></div>
      <div class="b-content">
        <p class="kicker">Calon Ketua OSIS</p>
        <h2 class="b-preview-name" id="bName"></h2>
        <p class="b-preview-sub" id="bNo"></p>
        <div class="b-scroll scroll-area">
          <div class="b-block">
            <span class="b-label">Visi</span>
            <p class="vision-text" id="bVisi"></p>
          </div>
          <div class="b-block">
            <span class="b-label">Misi</span>
            <div id="bMisi"></div>
          </div>
        </div>
        <button class="btn btn-gold b-select" type="button" id="bSelect">Pilih kandidat ini</button>
      </div>
    </section>
  </div>

  <footer class="mock-bar">
    <p class="count"><strong id="bCount">0</strong>/<span id="bLimit">1</span> dipilih</p>
    <button class="btn btn-gold" type="button" id="bSubmit" disabled>Kirim suara</button>
  </footer>

  <div class="toast" id="bToast" role="status" aria-live="polite"></div>

  <script src="data.js"></script>
  <script>
    (() => {
      const candidates = window.MOCK_CANDIDATES;
      const list = document.getElementById('bList');
      const photo = document.getElementById('bPhoto');
      const name = document.getElementById('bName');
      const number = document.getElementById('bNo');
      const visi = document.getElementById('bVisi');
      const misi = document.getElementById('bMisi');
      const select = document.getElementById('bSelect');
      const count = document.getElementById('bCount');
      const limitEl = document.getElementById('bLimit');
      const submit = document.getElementById('bSubmit');
      let limit = 1;
      let picks = [];
      let preview = 1;
      let toastTimer = null;

      function toast(message) {
        const el = document.getElementById('bToast');
        el.textContent = message;
        el.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
      }

      function renderList() {
        list.replaceChildren();
        for (const c of candidates) {
          const row = document.createElement('button');
          row.type = 'button';
          row.className = 'b-row';
          row.dataset.no = String(c.no);
          row.setAttribute('aria-label', `Lihat ${c.nama}`);

          const avatar = document.createElement('img');
          avatar.className = 'b-avatar';
          avatar.src = c.foto;
          avatar.alt = '';

          const info = document.createElement('span');
          info.className = 'b-info';
          const rowName = document.createElement('span');
          rowName.className = 'b-name';
          rowName.textContent = c.nama;
          const line = document.createElement('span');
          line.className = 'b-line';
          line.textContent = c.visi;
          info.append(rowName, line);

          const check = document.createElement('span');
          check.className = 'b-check';
          check.textContent = '✓';
          check.setAttribute('aria-hidden', 'true');

          row.append(avatar, info, check);
          row.addEventListener('click', () => {
            preview = c.no;
            update();
          });
          list.appendChild(row);
        }
      }

      function renderPreview() {
        const c = candidates.find((item) => item.no === preview);
        photo.src = c.foto;
        photo.alt = `Foto ${c.nama}`;
        name.textContent = c.nama;
        number.textContent = `Nomor ${String(c.no).padStart(2, '0')}`;
        visi.textContent = c.visi;
        misi.replaceChildren(window.mockMissionList(c.misi));
      }

      function update() {
        count.textContent = String(picks.length);
        limitEl.textContent = String(limit);
        submit.disabled = picks.length !== limit;

        for (const row of list.querySelectorAll('.b-row')) {
          const no = Number(row.dataset.no);
          row.classList.toggle('is-preview', no === preview);
          row.classList.toggle('is-picked', picks.includes(no));
          row.setAttribute('aria-current', no === preview ? 'true' : 'false');
        }

        const picked = picks.includes(preview);
        if (picked) {
          select.textContent = 'Batalkan pilihan';
          select.disabled = false;
        } else if (picks.length >= limit) {
          select.textContent = 'Batalkan salah satu dulu';
          select.disabled = true;
        } else {
          select.textContent = 'Pilih kandidat ini';
          select.disabled = false;
        }

        renderPreview();
      }

      select.addEventListener('click', () => {
        const index = picks.indexOf(preview);
        if (index > -1) {
          picks.splice(index, 1);
        } else if (picks.length < limit) {
          picks.push(preview);
        } else {
          toast(`Mode demo ini hanya untuk ${limit} pilihan.`);
          return;
        }
        update();
      });

      document.querySelectorAll('.role-toggle button').forEach((button) => {
        button.addEventListener('click', () => {
          limit = Number(button.dataset.limit);
          picks = [];
          document.querySelectorAll('.role-toggle button').forEach((item) => {
            item.setAttribute('aria-pressed', item === button ? 'true' : 'false');
          });
          update();
        });
      });

      submit.addEventListener('click', () => {
        if (picks.length === limit) toast('Mockup B — suara tidak dikirim.');
      });

      renderList();
      update();
    })();
  </script>
</body>
</html>
